<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IQ データビューア</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --text: #1d2330;
    --muted: #5f6878;
    --border: #d9dde4;
    --accent: #1f5fbf;
    --warn: #a35a00;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
    font-size: 14px;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 20px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  header label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  select, input[type=number] {
    font: inherit;
    padding: 3px 6px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: #fff;
    color: var(--text);
  }
  input[type=number] { width: 72px; }
  main { padding: 12px 16px 32px; max-width: 1600px; margin: 0 auto; }
  .status {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 18px;
    margin-bottom: 4px;
  }
  .status .writing { color: var(--warn); }
  .note { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    margin-bottom: 12px;
  }
  h2 { font-size: 15px; margin: 0 4px 0 0; }
  .file-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 4px 4px 2px; }
  .file-bar select { max-width: 100%; }
  .file-bar .sub { color: var(--muted); }
  .panel > .note { margin: 0 4px 8px; }
  button {
    font: inherit;
    padding: 3px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: #fff;
    color: var(--text);
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #eef2f8; }
  button:disabled { color: #aab; cursor: default; }
  .grid {
    display: grid;
    grid-template-columns: minmax(0, 5fr) minmax(0, 4fr) minmax(0, 2fr);
    gap: 8px;
  }
  @media (max-width: 1100px) { .grid { grid-template-columns: minmax(0, 1fr); } }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid #c5cddb;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: -2px;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .busy { color: var(--accent); display: inline-flex; align-items: center; gap: 6px; }
  .busy progress { width: 140px; height: 8px; }
  .loading-host { position: relative; }
  .loading-overlay {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.65);
    color: var(--text);
    font-size: 14px;
  }
  .loading-host.loading .loading-overlay { display: flex; }
  .error { color: #b00020; }
</style>
</head>
<body>
<header>
  <h1>IQ データビューア</h1>
  <label>フォルダ <select id="folder"></select></label>
  <label>横軸 <select id="axis">
    <option value="obs">推定観測時刻</option>
    <option value="mtime">ファイルの更新時刻</option>
  </select></label>
  <label>最大距離 <input id="maxRange" type="number" min="0.1" max="40.96" step="0.5" value="4.24"> km</label>
  <label><input id="auto" type="checkbox" checked> 自動更新（5 秒ごと）</label>
  <label><input id="follow" type="checkbox" checked> 最新のファイルを下段に表示</label>
</header>
<main>
  <div class="status" id="status">読み込み中…</div>
  <p class="note" id="axisNote"></p>
  <section class="panel">
    <div id="timeHeight" style="height: 620px"><div class="empty">フォルダを選んでください</div></div>
  </section>
  <section class="panel">
    <div class="file-bar">
      <h2>表示するファイル</h2>
      <button id="prevFile" type="button" title="1 つ前のファイルを表示する">◀ 前</button>
      <select id="fileSelect"></select>
      <button id="nextFile" type="button" title="1 つ後のファイルを表示する">次 ▶</button>
      <span class="sub" id="fileTitle"></span>
    </div>
    <p class="note">上の時間・高度図をクリックしても選べます。ファイルを選ぶと「最新のファイルを下段に表示」はオフになります。</p>
    <div class="grid loading-host" id="fileArea">
      <div class="loading-overlay"><span class="spinner"></span><span id="fileLoadingText">ファイルを読み込んで計算しています…</span></div>
      <div id="profile" style="height: 520px"></div>
      <div id="spectrum" style="height: 520px"></div>
      <div id="ppi" style="height: 520px"></div>
    </div>
  </section>
</main>
<script src="/plotly.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
